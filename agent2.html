<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarah Williams - Dream Homes</title>

    <link rel="stylesheet" href="css/style.css">

<body>

<header>

    <h1>🏠 Dream Homes</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="property.html">Properties</a>
    </nav>

</header>

<section class="agent-page">

    <img src="images/agent2.jpg" alt="Sarah Williams">

    <h2>Sarah Williams</h2>

    <h3>Luxury Villa Specialist</h3>

    <p><strong>📞 Phone:</strong> +91 9876543211</p>

    <p><strong>✉ Email:</strong> sarah@dreamhomes.com</p>

    <p><strong>📍 Office:</strong> Hyderabad, India</p>

    <form>

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <textarea
            id="message"
            placeholder="Write your Message"
            required
        ></textarea>

        <button
            type="button"
            onclick="scheduleVisit()"
        >
            Schedule Property Visit
        </button>

        <p id="successMessage"></p>

    </form>

</section>
